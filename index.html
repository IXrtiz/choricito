<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choricito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: playful and warm, for kids and the grown-up building the robot with them
   IDEA: a toy box lid - the robot stands on a play mat, chunky toy keys below
   PICTURE: the live 3D walking robot bull, rounded and toy-like, in the kit's own colours
   COLOUR and TYPE: brick white and grey, screen navy, kit red, horn brown, pin blue; Fredoka rounded
   LAYOUT: title strip, big 3D stage, three large buttons; buttons stack on narrow phones */
:root{color-scheme:light dark;--bg:light-dark(#e9e9e9,#1b2530);--ink:light-dark(#1c2a35,#f4f4f4);--panel:light-dark(#fff,#263442);
  --red:#c40f0f;--red-d:#8a0a0a;--blue:#2f6fc0;--blue-d:#1d4a86;--brown:#8a2e17;--brown-d:#5c1d0d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 Fredoka,"Trebuchet MS",system-ui,sans-serif;overflow:hidden;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh}
header{display:flex;align-items:center;gap:12px;padding:10px max(4vw,14px)}
h1{margin:0;font-size:clamp(24px,4.2vw,36px);line-height:1.05;font-weight:700;text-wrap:balance}
header p{margin:2px 0 0;font-size:15px;opacity:.8}
.grow{flex:1}
#sonido{font:600 15px Fredoka,system-ui,sans-serif;border:0;border-radius:999px;padding:10px 16px;min-height:44px;cursor:pointer;
  background:var(--panel);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
#sonido[aria-pressed=false]{opacity:.65}
#stage{position:relative;margin:0 max(2vw,8px);border-radius:24px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 30%,light-dark(#fff,#2c3b4b),light-dark(#d9dde2,#16202a));box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bubble{position:absolute;left:0;top:0;padding:12px 20px;background:#fff;color:#1c2a35;border-radius:22px;
  font-size:clamp(20px,3vw,28px);font-weight:700;line-height:1.1;box-shadow:0 6px 18px rgba(0,0,0,.2);white-space:nowrap;
  transform:translate(-50%,-100%) scale(.6);opacity:0;transition:opacity .18s,transform .18s;pointer-events:none}
#bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#stage.camon #cam{display:block}
#stage.camon{background:#000}
#note{position:absolute;right:12px;top:12px;max-width:70%;padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.92);color:#1c2a35;font-size:14px;display:none}
#note.on{display:block}
body.intro>header,body.intro>main,body.intro>nav{visibility:hidden}
#intro{position:fixed;inset:0;display:none;place-items:center;background:var(--bg);z-index:5;padding:20px}
body.intro #intro{display:grid}
#ver{font:700 clamp(24px,5vw,34px)/1.1 Fredoka,system-ui,sans-serif;color:#fff;background:var(--red);border:0;border-radius:28px;
  padding:22px 34px;min-height:76px;cursor:pointer;box-shadow:0 8px 0 var(--red-d);display:flex;align-items:center;gap:14px;animation:pulse 1.6s ease-in-out infinite}
#ver svg{width:44px;height:44px;flex:none}
#ver:active{transform:translateY(5px);box-shadow:0 3px 0 var(--red-d)}
#ver:focus-visible{outline:4px solid #ffd93b;outline-offset:4px}
@keyframes pulse{50%{transform:scale(1.05)}}
@media(prefers-reduced-motion:reduce){#ver{animation:none}}
#hint{position:absolute;left:14px;bottom:12px;font-size:14px;opacity:.7;pointer-events:none}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px max(2vw,8px) max(14px,env(safe-area-inset-bottom));max-width:980px;width:100%;margin:0 auto}
nav button{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:10px 14px;border:0;border-radius:20px;cursor:pointer;
  font:700 clamp(17px,2.3vw,21px)/1.1 Fredoka,system-ui,sans-serif;color:#fff;text-align:left;transition:transform .08s,box-shadow .08s}
nav button svg{width:36px;height:36px;flex:none}
nav button small{display:block;font-weight:500;font-size:13px;opacity:.9}
.b1{background:var(--blue);box-shadow:0 6px 0 var(--blue-d)}.b2{background:var(--red);box-shadow:0 6px 0 var(--red-d)}.b3{background:var(--brown);box-shadow:0 6px 0 var(--brown-d)}
nav button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
nav button[aria-pressed=true]{outline:4px solid #fff;outline-offset:2px}
nav button:focus-visible,#sonido:focus-visible{outline:4px solid #ffd93b;outline-offset:3px}
@media(max-width:600px){
  header p,#hint{display:none}
  nav{grid-template-columns:1fr;gap:9px}
  nav button{min-height:54px;justify-content:flex-start;padding-left:18px}
  nav button svg{width:30px;height:30px}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body class="intro">
<div id="intro">
  <button id="ver" type="button">
    <svg viewBox="0 0 44 44" aria-hidden="true"><rect x="3" y="11" width="38" height="27" rx="7" fill="#fff"/><path d="M14 11l3-5h10l3 5" fill="#fff"/><circle cx="22" cy="24.5" r="8" fill="#c40f0f"/><circle cx="22" cy="24.5" r="3.5" fill="#fff"/></svg>
    Ver a Choricito
  </button>
</div>
<header>
  <div class="grow">
    <h1>Choricito</h1>
    <p>Gíralo con el dedo y haz que camine, muja o dé vueltas.</p>
  </div>
  <button id="sonido" type="button" aria-pressed="true">Sonido: sí</button>
</header>

<main id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="c" aria-label="Modelo 3D de Choricito, el robot torito"></canvas>
  <div id="bubble" aria-hidden="true"></div>
  <div id="note" role="status"></div>
  <div id="hint">Arrastra para girar · pellizca para acercar</div>
</main>

<nav>
  <button class="b1" id="b-walk" type="button" aria-pressed="false">
    <svg viewBox="0 0 40 40" aria-hidden="true"><g fill="#fff"><ellipse cx="13" cy="12" rx="5" ry="7"/><ellipse cx="27" cy="26" rx="5" ry="7"/><circle cx="9" cy="3.5" r="2"/><circle cx="14" cy="2.5" r="2"/><circle cx="23" cy="17.5" r="2"/><circle cx="28" cy="16.5" r="2"/></g></svg>
    <span id="walk-l">Caminar<small>Mueve sus patitas</small></span>
  </button>
  <button class="b2" id="b-moo" type="button">
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 8h30a4 4 0 0 1 4 4v13a4 4 0 0 1-4 4H17l-8 7v-7H5a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z" fill="#fff"/><text x="20" y="23" text-anchor="middle" font-size="11" font-weight="700" fill="#c40f0f" font-family="Fredoka,sans-serif">MUU</text></svg>
    <span>Mugir<small>Saluda con los cuernos</small></span>
  </button>
  <button class="b3" id="b-spin" type="button" aria-pressed="false">
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M32 20a12 12 0 1 1-4-9" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M30 3v10H20" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Dar vueltas<small>Míralo por todos lados</small></span>
  </button>
</nav>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
{
  const C = { white:0xf4f4f4, grey:0x9a9a9a, dgrey:0x5e6266, gear:0x4a4d51, navy:0x1c2a35, red:0xc40f0f, brown:0x8a2e17, blue:0x2f6fc0, tan:0xc9b27c, black:0x111418 };
  const mats = {};
  const M = c => mats[c] || (mats[c] = new THREE.MeshStandardMaterial({ color:c, roughness:.42, metalness:0 }));
  const mesh = (g, c) => { const m = new THREE.Mesh(g, M(c)); m.castShadow = m.receiveShadow = true; return m; };
  const rbox = (w,h,d,r,c) => mesh(new RoundedBoxGeometry(w,h,d,4,r), c);
  const at = (o,x,y,z) => { o.position.set(x,y,z); return o; };

  const stage = document.getElementById('stage'), canvas = document.getElementById('c'), bubble = document.getElementById('bubble');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
  scene.environmentIntensity = .5;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, .9));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(3, 6, 4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left:-3, right:3, top:3, bottom:-3, near:.5, far:20 });
  sun.shadow.bias = -.0004; sun.shadow.normalBias = .02;
  scene.add(sun);

  // ---------- play mat with dots (scrolls while walking)
  const tc = document.createElement('canvas'); tc.width = tc.height = 256;
  const tx = tc.getContext('2d');
  tx.fillStyle = '#e4e6e9'; tx.fillRect(0,0,256,256);
  [['#c40f0f',64,64],['#2f6fc0',192,64],['#f4f4f4',64,192],['#9a9a9a',192,192]].forEach(([c,x,y]) => { tx.fillStyle = c; tx.beginPath(); tx.arc(x,y,22,0,7); tx.fill(); });
  const matTex = new THREE.CanvasTexture(tc);
  matTex.colorSpace = THREE.SRGBColorSpace; matTex.wrapS = matTex.wrapT = THREE.RepeatWrapping; matTex.repeat.set(13,13);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(7, 96), new THREE.MeshStandardMaterial({ map:matTex, roughness:.9 }));
  const matFloor = floor.material, shadowFloor = new THREE.ShadowMaterial({ opacity:.3 });
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

  // ---------- part makers
  function beamGeo(n) { // technic beam with n holes, long axis down -y
    const p = .085, h = .042, len = (n-1)*p, s = new THREE.Shape();
    s.moveTo(-h,0); s.lineTo(-h,-len); s.absarc(0,-len,h,Math.PI,Math.PI*2,false); s.lineTo(h,0); s.absarc(0,0,h,0,Math.PI,false);
    for (let i=0;i<n;i++) { const k = new THREE.Path(); k.absarc(0,-i*p,.024,0,Math.PI*2,true); s.holes.push(k); }
    const g = new THREE.ExtrudeGeometry(s, { depth:.036, bevelEnabled:true, bevelSize:.006, bevelThickness:.006, bevelSegments:2, curveSegments:12 });
    g.translate(0,0,-.018); return g;
  }
  const beam = (n,c) => { const m = mesh(beamGeo(n), c); m.rotation.y = Math.PI/2; const g = new THREE.Group(); g.add(m); return g; };
  function gear(teeth, r, c, holes) {
    const s = new THREE.Shape(), st = Math.PI*2/teeth, ri = r - .035;
    for (let i=0;i<teeth;i++) { const a = i*st;
      [[a,ri],[a+st*.2,r],[a+st*.5,r],[a+st*.7,ri]].forEach(([q,rr],j) => (i||j) ? s.lineTo(Math.cos(q)*rr, Math.sin(q)*rr) : s.moveTo(Math.cos(q)*rr, Math.sin(q)*rr)); }
    const hp = [[0,0]]; for (let i=0;i<holes;i++) { const q = i*Math.PI*2/holes; hp.push([Math.cos(q)*r*.55, Math.sin(q)*r*.55]); }
    hp.forEach(([x,y]) => { const k = new THREE.Path(); k.absarc(x,y,.028,0,Math.PI*2,true); s.holes.push(k); });
    const g = new THREE.ExtrudeGeometry(s, { depth:.04, bevelEnabled:true, bevelSize:.005, bevelThickness:.005, bevelSegments:1 });
    g.translate(0,0,-.02);
    const m = mesh(g, c); m.rotation.y = Math.PI/2;
    const axle = mesh(new THREE.CylinderGeometry(.022,.022,.07,6), C.tan); axle.rotation.z = Math.PI/2;
    const w = new THREE.Group(); w.add(m, axle); return w;
  }
  const pin = (c=C.blue) => { const m = mesh(new THREE.CylinderGeometry(.03,.03,.05,16), c); m.rotation.z = Math.PI/2; return m; };

  // ---------- the robot
  const robot = new THREE.Group(); scene.add(robot);
  const body = new THREE.Group(); robot.add(body);

  // EV3 brick: grey core, white shell on top and sides
  body.add(at(rbox(.92,.42,1.36,.08,C.grey), 0,1.14,0));
  body.add(at(rbox(1.0,.2,1.42,.09,C.white), 0,1.4,0));
  body.add(at(rbox(.08,.32,1.1,.04,C.white), -.5,1.18,0), at(rbox(.08,.32,1.1,.04,C.white), .5,1.18,0));
  body.add(at(rbox(.6,.03,.62,.04,C.navy), 0,1.505,.2));            // screen frame
  body.add(at(rbox(.48,.03,.5,.02,C.grey), 0,1.515,.2));            // screen
  body.add(at(rbox(.18,.03,.12,.03,C.grey), 0,1.51,-.32));          // centre button
  body.add(at(rbox(.1,.03,.07,.03,C.grey), -.17,1.51,-.32), at(rbox(.1,.03,.07,.03,C.grey), .17,1.51,-.32));
  body.add(at(rbox(.32,.03,.07,.02,C.navy), 0,1.505,-.6));          // top slot
  for (let i=0;i<4;i++) body.add(at(rbox(.13,.12,.03,.015,C.dgrey), -.24+i*.16,1.2,.69)); // ports on the front
  // gearbox under the brick
  body.add(at(rbox(.74,.38,1.2,.07,C.grey), 0,.76,0));
  body.add(at(rbox(.56,.16,.08,.03,C.dgrey), 0,.88,.62));
  // friendly face on the front
  const face = new THREE.Group(); at(face, 0,1.06,.72); body.add(face);
  const eyes = [];
  [-.2,.2].forEach(x => {
    const e = new THREE.Group(); at(e, x,0,0);
    const w = mesh(new THREE.SphereGeometry(.12,32,16), C.white); w.scale.z = .5;
    const p = mesh(new THREE.SphereGeometry(.06,24,12), C.black); p.position.set(x>0?-.012:.012,-.01,.04); p.scale.z = .5;
    const s = mesh(new THREE.SphereGeometry(.018,12,8), C.white); s.position.set(.02,.03,.07);
    e.add(w,p,s); face.add(e); eyes.push(e);
  });
  const nose = rbox(.34,.11,.06,.05,C.red); at(nose, 0,-.2,.0); face.add(nose);
  [-.07,.07].forEach(x => face.add(at(mesh(new THREE.SphereGeometry(.022,12,8), C.navy), x,-.2,.035)));
  // red tail parts on the back + red bars underneath
  [-.17,.17].forEach(x => {
    const t = beam(4, C.red); t.rotation.y = Math.PI/2; at(t, x,1.24,-.72); body.add(t);
    body.add(at(rbox(.22,.1,.05,.03,C.red), x,1.24,-.73));
    body.add(at(pin(), x,1.24,-.76));
    body.add(at(rbox(.1,.08,.42,.03,C.red), x*.8,.53,.05));
  });

  // horns: white beam out sideways, bend up, brown tip
  const horns = [];
  [-1,1].forEach(sd => {
    const h = new THREE.Group(); at(h, sd*.12,1.3,.76); body.add(h); horns.push(h);
    const a = beam(10, C.white); a.rotation.z = sd * Math.PI/2; h.add(a);          // horizontal
    const b = beam(4, C.white); at(b, sd*.765,0,0); b.rotation.z = sd*(Math.PI/2 + Math.PI/4); h.add(b); // 45° bend
    const v = beam(3, C.white); at(v, sd*.95,.18,0); v.rotation.z = Math.PI; h.add(v); // up
    const prof = [[0,0],[.05,.02],[.07,.1],[.062,.2],[.04,.3],[.012,.38],[0,.4]].map(([x,y]) => new THREE.Vector2(x,y));
    const tip = mesh(new THREE.LatheGeometry(prof, 24), C.brown); at(tip, sd*.95,.34,0); tip.rotation.x = .25; h.add(tip);
    h.add(at(pin(C.red), sd*.95,.35,.0));
    [.1,.35].forEach(x => h.add(at(pin(), sd*x,0,.03)));
  });

  // gears and legs on both sides
  const legs = [], gears = [];
  [-1,1].forEach(sd => {
    const xg = sd*.42;
    const big = gear(40,.27,C.grey,8); at(big, xg,.62,0); body.add(big); gears.push([big,-1]);
    [[.44,C.gear],[-.44,sd>0?C.red:C.gear]].forEach(([z,c]) => { const g = gear(24,.17,c,4); at(g, xg,.62,z); body.add(g); gears.push([g,1]); });
    [.44,-.44].forEach((z,k) => {
      const hip = new THREE.Group(); at(hip, sd*.5,.62,z); body.add(hip);
      const front = z>0 ? 1 : -1;
      const l1 = beam(8, C.grey); l1.rotation.x = front*.32; hip.add(l1);
      const l2 = beam(7, C.grey); at(l2, sd*.06,-.02,-front*.1); l2.rotation.x = -front*.12; hip.add(l2);
      const foot = new THREE.Group(); at(foot, sd*.03,-.58,-front*.09); hip.add(foot);
      foot.add(at(rbox(.16,.1,.18,.045,C.navy), 0,-.02,0));
      [-.04,.04].forEach(zz => foot.add(at(pin(), sd*.085,0,zz)));
      hip.add(at(pin(), sd*.04,0,0));
      legs.push({ hip, foot, phase: (k ? Math.PI : 0) + (sd>0 ? Math.PI : 0) });
    });
  });
  robot.position.y = .02;

  // ---------- camera
  const camera = new THREE.PerspectiveCamera(36, 1, .05, 60);
  const target = new THREE.Vector3(0,.95,0);
  const controls = new OrbitControls(camera, canvas);
  controls.target.copy(target);
  Object.assign(controls, { enablePan:false, enableDamping:true, minDistance:2.6, maxDistance:9, maxPolarAngle:1.55, autoRotateSpeed:2.2 });
  let fitted = false;
  function fit() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w,h,false); camera.aspect = w/h;
    const v = THREE.MathUtils.degToRad(camera.fov/2), hz = Math.atan(Math.tan(v)*camera.aspect);
    const d = Math.max(1.35/Math.tan(v), 1.75/Math.tan(hz));
    const dir = fitted ? camera.position.clone().sub(target) : new THREE.Vector3(.8,.32,1); fitted = true;
    camera.position.copy(target).add(dir.normalize().multiplyScalar(d));
    camera.updateProjectionMatrix(); controls.update();
  }
  new ResizeObserver(fit).observe(stage); fit();

  // ---------- sound
  let soundOn = true, ac = null;
  const sBtn = document.getElementById('sonido');
  sBtn.addEventListener('click', () => { soundOn = !soundOn; if (!soundOn) { stopMusic(); if (hasTTS) speechSynthesis.cancel(); } else if (controls.autoRotate) startMusic(); sBtn.setAttribute('aria-pressed', String(soundOn)); sBtn.textContent = soundOn ? 'Sonido: sí' : 'Sonido: no'; });
  function moo() {
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime, o = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'sawtooth'; o2.type = 'square';
      o.frequency.setValueAtTime(150,t); o.frequency.linearRampToValueAtTime(190,t+.25); o.frequency.linearRampToValueAtTime(120,t+1.1);
      o2.frequency.setValueAtTime(75,t); o2.frequency.linearRampToValueAtTime(60,t+1.1);
      f.type = 'lowpass'; f.frequency.setValueAtTime(500,t); f.frequency.linearRampToValueAtTime(900,t+.3); f.frequency.linearRampToValueAtTime(350,t+1.1);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.25,t+.12); g.gain.setValueAtTime(.25,t+.8); g.gain.linearRampToValueAtTime(0,t+1.2);
      o.connect(f); o2.connect(f); f.connect(g); g.connect(ac.destination);
      o.start(t); o2.start(t); o.stop(t+1.25); o2.stop(t+1.25);
    } catch (e) {}
  }

  // ---------- voice
  const hasTTS = 'speechSynthesis' in window;
  let voice = null;
  const pickVoice = () => { const vs = speechSynthesis.getVoices().filter(x => /^es/i.test(x.lang));
    voice = vs.find(x => /es[-_](MX|US|419|AR)/i.test(x.lang)) || vs[0] || null; };
  if (hasTTS) { pickVoice(); speechSynthesis.addEventListener?.('voiceschanged', pickVoice); }
  function speak(text) {
    showBubble(text, 2.2);
    if (!soundOn || !hasTTS) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text);
      u.lang = voice ? voice.lang : 'es-ES'; if (voice) u.voice = voice; u.pitch = 1.8; u.rate = 1.12; u.volume = 1;
      speechSynthesis.speak(u); } catch (e) {}
  }
  let bubbleLeft = 0;
  function showBubble(text, secs) { bubble.textContent = text; bubble.classList.add('on'); bubbleLeft = secs; }

  // ---------- happy music while spinning (synthesised, loops)
  const N = n => 440 * 2 ** ((n - 69) / 12);
  // melody in C major, eighth notes; 0 = rest
  const MEL = [72,76,79,76, 77,81,79,0, 76,79,84,79, 77,76,74,0, 72,76,79,76, 77,81,79,77, 76,74,72,74, 72,0,79,0];
  const BAS = [48,0,55,0, 53,0,48,0, 48,0,55,0, 55,0,43,0, 48,0,55,0, 53,0,48,0, 55,0,43,0, 48,0,48,0];
  let musicOn = false, step = 0, nextT = 0, timer = null;
  const audio = () => (ac = ac || new (window.AudioContext || window.webkitAudioContext)());
  function note(f, t, d, type, vol) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
  }
  function tick(t) { const g = ac.createGain(), o = ac.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(300, t + .05);
    g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .06); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .08); }
  function schedule() {
    const e = .16; // eighth note length (~94 bpm in quarters x2 = bouncy)
    while (nextT < ac.currentTime + .15) {
      const i = step % MEL.length;
      if (MEL[i]) { note(N(MEL[i]), nextT, .22, 'square', .07); note(N(MEL[i] + 12), nextT, .12, 'sine', .04); }
      if (BAS[i]) note(N(BAS[i]), nextT, .3, 'triangle', .2);
      if (i % 2 === 0) tick(nextT);
      nextT += e; step++;
    }
  }
  function startMusic() { if (!soundOn || musicOn) return; try { audio(); ac.resume?.(); musicOn = true; step = 0; nextT = ac.currentTime + .05; schedule(); timer = setInterval(schedule, 40); } catch (e) {} }
  function stopMusic() { musicOn = false; clearInterval(timer); }

  // ---------- camera
  const video = document.getElementById('cam'), note2 = document.getElementById('note');
  async function startCamera() {
    try {
      const st = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
      video.srcObject = st; await video.play().catch(() => {});
      const fm = st.getVideoTracks()[0]?.getSettings?.().facingMode;
      video.style.transform = fm === 'environment' ? 'none' : 'scaleX(-1)';
      stage.classList.add('camon'); floor.material = shadowFloor;
    } catch (e) {
      note2.textContent = 'No se pudo encender la cámara. Choricito te espera en su alfombra.';
      note2.classList.add('on'); setTimeout(() => note2.classList.remove('on'), 5000);
    }
  }
  document.getElementById('ver').addEventListener('click', () => {
    try { audio(); ac.resume?.(); } catch (e) {}
    if (hasTTS) try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
    document.body.classList.remove('intro'); fit(); startCamera();
  });

  // ---------- buttons
  let walking = false, mooT = -1, walkT = 0;
  const wBtn = document.getElementById('b-walk'), wLbl = document.getElementById('walk-l'), spBtn = document.getElementById('b-spin');
  wBtn.addEventListener('click', () => {
    walking = !walking; wBtn.setAttribute('aria-pressed', String(walking));
    wLbl.firstChild.textContent = walking ? 'Parar' : 'Caminar';
    if (walking) speak('¡Hola, amigo!');
  });
  document.getElementById('b-moo').addEventListener('click', () => { mooT = 0; moo(); showBubble('¡Muuuu!', 1.8); });
  spBtn.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; spBtn.setAttribute('aria-pressed', String(controls.autoRotate)); controls.autoRotate ? startMusic() : stopMusic(); });

  // ---------- loop
  const clock = new THREE.Clock(), v3 = new THREE.Vector3();
  let blink = 2.5;
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), .1), t = clock.elapsedTime;
    const amp = THREE.MathUtils.damp(legs[0].amp || 0, walking ? 1 : 0, 4, dt);
    legs.forEach(l => { l.amp = amp; });
    if (walking || amp > .01) walkT += dt * 5.5;
    legs.forEach(l => {
      const s = Math.sin(walkT + l.phase);
      l.hip.rotation.x = s * .38 * amp;
      l.foot.position.y = -.58 + Math.max(0, Math.cos(walkT + l.phase)) * .05 * amp;
    });
    gears.forEach(([g,d]) => { g.rotation.x = walkT * .5 * d * (d<0 ? .6 : 1); });
    body.position.y = Math.abs(Math.sin(walkT)) * .03 * amp;
    body.rotation.z = Math.sin(walkT) * .025 * amp;
    matTex.offset.y = (matTex.offset.y - dt * .35 * amp) % 1;
    // moo: horns wiggle, body hops
    if (mooT >= 0) {
      mooT += dt;
      const k = Math.max(0, 1 - mooT/1.4);
      horns.forEach((h,i) => { h.rotation.z = Math.sin(mooT*22) * .12 * k * (i ? 1 : -1); });
      body.position.y += Math.abs(Math.sin(mooT*7)) * .08 * k;
      body.rotation.x = -Math.sin(mooT*7) * .05 * k;
      if (mooT > 1.8) { mooT = -1; horns.forEach(h => { h.rotation.z = 0; }); body.rotation.x = 0; }
    }
    // blink
    blink -= dt;
    const sy = blink < 0 ? .1 : 1; eyes.forEach(e => { e.scale.y = sy; });
    if (blink < -.12) blink = 2 + Math.random()*3;
    if (bubbleLeft > 0 && (bubbleLeft -= dt) <= 0) bubble.classList.remove('on');
    controls.update();
    if (bubble.classList.contains('on')) {
      v3.set(0,1.95,.4); body.localToWorld(v3); v3.project(camera);
      const w = stage.clientWidth, h = stage.clientHeight, bw = bubble.offsetWidth, bh = bubble.offsetHeight;
      bubble.style.left = Math.min(Math.max((v3.x*.5+.5)*w, bw/2+8), w-bw/2-8) + 'px';
      bubble.style.top = Math.min(Math.max((-v3.y*.5+.5)*h, bh+10), h-10) + 'px';
    }
    renderer.render(scene, camera);
  });
}
</script>
</body>
